*{box-sizing:border-box}

/* IN-APP TOAST NOTIFICATIONS */

#toastContainer{

  position:fixed;

  top:20px;

  right:20px;

  z-index:999999;

  display:flex;

  flex-direction:column;

  gap:10px;

  pointer-events:none;

}

.toast-msg{

  background:#1e293b;

  color:#fff;

  padding:12px 18px;

  border-radius:4px;

  box-shadow:0 6px 20px rgba(0,0,0,.25);

  font-size:13px;

  font-weight:600;

  display:flex;

  align-items:center;

  gap:8px;

  animation:toastSlide .3s ease;

  pointer-events:auto;

}

.toast-msg.success{background:#15803d;border-left:4px solid var(--fk-yellow)}

.toast-msg.error{background:#b91c1c;border-left:4px solid #fca5a5}

@keyframes toastSlide{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

.nav-sub li.active{color:var(--fk-blue);border-bottom:2px solid var(--fk-blue);font-weight:700}



/* SALE BANNER */

.sale-banner-wrap{max-width:1480px;margin:12px auto 0;padding:0 14px}

.big-sale-banner{background:radial-gradient(circle at 80% 50%, #ff5252, #b71c1c 45%, #0d47a1 95%);color:#fff;border-radius:4px;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 2px 8px rgba(0,0,0,.12);position:relative;overflow:hidden}

.sale-tag-pill{background:var(--fk-yellow);color:#111;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;display:inline-block;margin-bottom:6px;letter-spacing:1px}

.big-sale-banner h1{margin:0;font-size:24px;font-weight:900;letter-spacing:-.5px;line-height:1.2}

.big-sale-banner p{margin:6px 0 0;font-size:13px;color:#fce4ec}

.sale-timer{background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.25);padding:10px 16px;border-radius:4px;text-align:center;min-width:150px;white-space:nowrap}

.sale-timer .label{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--fk-yellow);font-weight:700}

.sale-timer .time{font-size:19px;font-weight:800;letter-spacing:1px;margin-top:2px}



/* MAIN 3-COLUMN LAYOUT */

.layout{

  max-width:1480px;

  margin:14px auto;

  padding:0 14px;

  display:grid;

  grid-template-columns:220px 1fr 280px;

  gap:14px;

  align-items:start;

}

.sidebar{background:var(--surface);padding:14px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08);height:fit-content;position:sticky;top:70px}

.sidebar h3{font-size:15px;margin:0 0 10px;padding-bottom:8px;border-bottom:1px solid var(--line)}

.filter-group{display:flex;flex-direction:column;gap:6px}

.filter-group label{font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;color:#444}



/* RIGHT SIDEBAR WIDGETS */

.right-sidebar{display:flex;flex-direction:column;gap:12px;position:sticky;top:70px}

.widget-box{background:var(--surface);padding:14px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08)}

.widget-box h4{margin:0 0 10px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);padding-bottom:6px}

.widget-box p{margin:0 0 10px;font-size:12px;color:#475569;line-height:1.4}

.btn-widget-wa{background:#25d366;color:#fff;border:0;width:100%;padding:8px 10px;font-weight:700;font-size:12px;border-radius:3px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px}

.btn-widget-call{background:var(--fk-blue);color:#fff;border:0;width:100%;padding:8px 10px;font-weight:700;font-size:12px;border-radius:3px;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}

.hot-deal-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}

.hot-deal-item:last-child{border-bottom:none;padding-bottom:0}

.hot-deal-item img{width:46px;height:46px;object-fit:contain;border:1px solid #e2e8f0;border-radius:2px}

.hot-deal-info b{font-size:12px;display:block;line-height:1.2;color:#1e293b}

.hot-deal-info span{font-size:11px;color:var(--fk-green);font-weight:700}



/* PRODUCT GRID */

.product-panel{background:var(--surface);border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.08);overflow:hidden}

.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}

.panel-head h2{margin:0;font-size:16px;font-weight:700}

.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0}



/* PRODUCT CARD &amp; STOCK BADGE */

.product-card{padding:14px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;position:relative}

.prod-img-wrap{height:140px;display:flex;align-items:center;justify-content:center;position:relative}

.prod-img-wrap img{max-height:120px;max-width:90%;object-fit:contain}

.assured-tag{position:absolute;bottom:0;right:0;font-size:9px;background:#f7f9fa;border:1px solid #dcdcdc;border-radius:2px;padding:2px 4px;font-weight:800;color:var(--fk-blue)}

.stock-status-pill{position:absolute;top:6px;left:6px;font-size:10px;padding:2px 6px;border-radius:10px;font-weight:800}

.stock-instock{background:#dcfce7;color:#166534}

.stock-out{background:#fee2e2;color:#991b1b}

.prod-title{margin:8px 0 4px;font-size:13px;font-weight:600;color:#212121;line-height:1.3;height:34px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.rating-pill{background:var(--fk-green);color:#fff;font-size:10px;font-weight:700;padding:2px 5px;border-radius:3px;display:inline-flex;align-items:center;gap:2px;width:fit-content}

.rating-count{font-size:11px;color:var(--muted);margin-left:4px}

.price-row{display:flex;align-items:baseline;gap:6px;margin:6px 0 2px}

.final-price{font-size:16px;font-weight:700;color:#212121}

.orig-price{font-size:12px;color:var(--muted);text-decoration:line-through}

.disc-percent{font-size:12px;font-weight:700;color:var(--fk-green)}

.delivery-badge{font-size:10px;color:#212121;font-weight:600;margin-bottom:8px}

.delivery-badge span{color:var(--fk-green);font-weight:700}



/* CARD CONTROLS */

.card-actions{margin-top:auto}

.btn-add-cart{background:var(--fk-yellow);color:#212121;border:0;width:100%;padding:8px;font-weight:700;font-size:12px;border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px}

.btn-add-cart:disabled{background:#e2e8f0;color:#94a3b8;cursor:not-allowed}

.qty-stepper{display:flex;align-items:center;justify-content:space-between;background:var(--fk-blue);color:#fff;border-radius:2px;overflow:hidden}

.qty-stepper button{background:none;border:0;color:#fff;padding:6px 12px;font-size:15px;font-weight:800;cursor:pointer}

.qty-stepper span{font-size:12px;font-weight:700}



/* FLY BALL */

.fly-item{position:fixed;width:20px;height:20px;background:var(--fk-orange);border-radius:50%;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:9999;transition:all .55s cubic-bezier(0.18, 0.89, 0.32, 1.28)}



/* OVERLAYS &amp; MODALS */

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none}

.overlay.show{display:flex;align-items:center;justify-content:center}



.auth-card{background:#fff;width:min(740px,94%);border-radius:4px;overflow:hidden;box-shadow:0 6px 30px rgba(0,0,0,.35);display:grid;grid-template-columns:240px 1fr;position:relative}

.auth-left{background:var(--fk-blue);color:#fff;padding:26px 20px;display:flex;flex-direction:column;justify-content:space-between}

.auth-left h2{margin:0 0 8px;font-size:20px}

.auth-left p{margin:0;font-size:13px;line-height:1.4;color:#dbeafe}

.auth-left .shield-icon{font-size:42px;margin-top:16px}

.auth-right{padding:20px;position:relative;max-height:85vh;overflow-y:auto}

.auth-close{position:absolute;top:8px;right:12px;background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer}



.auth-form{display:flex;flex-direction:column;gap:8px}

.auth-form label{font-size:11px;color:var(--muted);font-weight:600}

.auth-form input,.auth-form select,.auth-form textarea{border:1px solid var(--line);border-radius:2px;padding:8px 10px;font:inherit;font-size:13px;outline:none;background:#fff;width:100%}

.auth-form input:focus,.auth-form select:focus,.auth-form textarea:focus{border-color:var(--fk-blue)}

.auth-btn-primary{background:var(--fk-orange);color:#fff;border:0;padding:10px;font-size:13px;font-weight:700;border-radius:2px;cursor:pointer;margin-top:4px}

.auth-switch{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}

.auth-switch a{color:var(--fk-blue);font-weight:700;text-decoration:none;cursor:pointer}

.auth-msg{font-size:12px;padding:8px;border-radius:2px;display:none;line-height:1.4}

.auth-msg.err{background:#ffebee;color:#c62828;display:block}

.auth-msg.ok{background:#e8f5e9;color:#2e7d32;display:block}

.sec-badge{background:#fff3e0;border-left:4px solid var(--fk-orange);padding:8px;font-size:11px;color:#d84315;border-radius:2px;margin-bottom:8px;line-height:1.4}



/* CART DRAWER &amp; CHECKOUT */

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:#fff;z-index:201;display:flex;flex-direction:column;box-shadow:-2px 0 10px rgba(0,0,0,.2);transform:translateX(100%);transition:transform .3s ease}

.drawer.open{transform:translateX(0)}

.drawer-head{background:var(--fk-blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}

.drawer-head h2{margin:0;font-size:16px;font-weight:700}

.btn-close{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}

.drawer-body{flex:1;overflow-y:auto;padding:14px;background:#f1f3f6}



.cart-item-row{background:#fff;border-radius:2px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);display:flex;gap:10px}

.cart-item-row img{width:50px;height:50px;object-fit:contain}

.cart-item-details{flex:1}

.cart-item-details h4{margin:0 0 3px;font-size:12px}

.cart-item-details .price{font-weight:700;font-size:13px}

.cart-item-ctrl{display:flex;align-items:center;gap:6px;margin-top:6px}

.cart-item-ctrl button{border:1px solid #c2c2c2;background:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-weight:700}



.price-summary{background:#fff;border-radius:2px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.06);margin-bottom:10px}

.summary-row{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px}

.summary-total{display:flex;justify-content:space-between;border-top:1px dashed var(--line);padding-top:8px;font-weight:800;font-size:15px}



.checkout-box{background:#fff;padding:12px;border-radius:2px;box-shadow:0 1px 2px rgba(0,0,0,.06)}

.checkout-box h3{margin:0 0 8px;font-size:13px}

.checkout-box input,.checkout-box textarea{width:100%;border:1px solid var(--line);padding:8px;font:inherit;border-radius:2px;margin-bottom:6px;font-size:12px}



.btn-detect-loc{

  background:#f0fdf4;

  border:1px solid #86efac;

  color:#15803d;

  padding:6px 10px;

  border-radius:3px;

  font-weight:700;

  font-size:11px;

  cursor:pointer;

  display:inline-flex;

  align-items:center;

  gap:6px;

  margin-bottom:8px;

  width:100%;

  justify-content:center;

}

.btn-detect-loc:hover{background:#dcfce7}



.payment-choice{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}

.payment-choice label{display:flex;align-items:center;gap:8px;font-size:12px;border:1px solid var(--line);padding:8px;border-radius:3px;cursor:pointer}

.payment-choice label:hover{background:#f8fafc;border-color:var(--fk-blue)}

.upi-badge{background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:3px;font-weight:700;font-size:10px;margin-left:auto}

.btn-place-order{background:var(--fk-orange);color:#fff;border:0;width:100%;padding:11px;font-weight:700;font-size:14px;border-radius:2px;cursor:pointer}



/* MODALS */

.modal-track{background:#fff;width:min(560px,94%);border-radius:4px;overflow:hidden;box-shadow:0 4px 20px rgba(0,0,0,.2)}

.modal-head{background:var(--fk-blue);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}

.modal-head h3{margin:0;font-size:15px}

.modal-body{padding:16px;max-height:80vh;overflow-y:auto}

.track-input-group{display:flex;gap:6px;margin-bottom:12px}

.track-input-group input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:2px;font:inherit;font-size:13px}

.track-input-group button{background:var(--fk-blue);color:#fff;border:0;padding:8px 14px;font-weight:700;border-radius:2px;cursor:pointer;font-size:13px;white-space:nowrap}



.tracker-status-box{background:#f9f9f9;border:1px solid var(--line);border-radius:4px;padding:12px;margin-bottom:12px}

.timeline{display:flex;justify-content:space-between;position:relative;margin:18px 0 12px}

.timeline::before{content:&quot;&quot;;position:absolute;top:10px;left:10%;right:10%;height:3px;background:#e0e0e0;z-index:1}

.timeline-step{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;width:25%}

.timeline-dot{width:22px;height:22px;border-radius:50%;background:#e0e0e0;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800}

.timeline-step.completed .timeline-dot{background:var(--fk-green)}

.timeline-step.current .timeline-dot{background:var(--fk-blue);box-shadow:0 0 0 3px rgba(40,116,240,.2)}

.timeline-step span{font-size:10px;font-weight:600;margin-top:4px;color:#555}



/* UNIQUE DELIVERY CODE BADGE */

.delivery-code-pill{

  background:#fef3c7;

  border:1px dashed #d97706;

  color:#92400e;

  padding:8px 12px;

  border-radius:4px;

  font-weight:800;

  font-size:14px;

  text-align:center;

  margin:10px 0;

  display:flex;

  justify-content:space-between;

  align-items:center;

}

.delivery-code-pill span.code-num{

  font-size:18px;

  letter-spacing:3px;

  color:#b45309;

  background:#fff;

  padding:2px 8px;

  border-radius:3px;

  border:1px solid #fcd34d;

}

.admin-export-btn{background:#10b981;color:#fff;border:0;padding:6px 12px;border-radius:3px;font-weight:700;cursor:pointer;font-size:12px}

.admin-tabs{display:flex;gap:8px;border-bottom:2px solid var(--line);padding-bottom:8px;flex-wrap:wrap}

/* COMPANY NOTICE BOARD CARD */

.company-bulletin-card{background:#fff;border:1px solid #bfdbfe;border-radius:4px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:14px;align-items:center}

.company-bulletin-card img{width:70px;height:70px;object-fit:cover;border-radius:4px;border:1px solid #cbd5e1}

.bulletin-content{flex:1}

.bulletin-content h4{margin:0 0 4px;color:#1e3a8a;font-size:14px}

.bulletin-content p{margin:0;font-size:12px;color:#334155}

.bulletin-date{font-size:10px;color:var(--muted);margin-top:4px}



.mailbox-card{background:#fff;border-radius:4px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}

.mailbox-header{background:#f8fafc;padding:10px 14px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13px}

.mail-row{display:grid;grid-template-columns:110px 170px 1fr 110px 100px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}

.mail-row:hover{background:#f1f5f9}

.mail-orderid{color:var(--fk-blue);font-weight:800;text-decoration:underline}

.mail-status-pill{padding:2px 6px;border-radius:10px;font-size:10px;font-weight:700;text-align:center}

.st-1{background:#fef3c7;color:#92400e}

.st-3{background:#ede9fe;color:#6d28d9}

.admin-prod-form{background:#f8fafc;border:1px solid var(--line);padding:14px;border-radius:4px;margin-bottom:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}

.admin-prod-form input, .admin-prod-form select, .admin-prod-form textarea{border:1px solid var(--line);border-radius:3px;padding:8px;font:inherit;font-size:12px;background:#fff;width:100%}

.admin-prod-form button{background:var(--fk-green);color:#fff;border:0;padding:9px;font-weight:700;border-radius:3px;cursor:pointer;font-size:12px}

.btn-edit-prod{background:var(--fk-blue);color:#fff;border:0;padding:5px 10px;border-radius:2px;font-weight:700;cursor:pointer;font-size:11px;margin-right:2px}

function cleanPhone(val) {

  if(!val) return &#x27;&#x27;;

  let num = val.toString().replace(/\D/g, &#x27;&#x27;);

  if(num.length &gt; 10 &amp;&amp; num.startsWith(&#x27;91&#x27;)) num = num.slice(2);

  if(num.length &gt; 10 &amp;&amp; num.startsWith(&#x27;0&#x27;)) num = num.slice(1);

  return num;

}

function showToast(text, type = &quot;info&quot;) {

  const toast = document.createElement(&#x27;div&#x27;);

// 🕒 LIVE REAL-TIME CLOCK

function startRealTimeClock() {

  function updateClock() {

    const now = new Date();

    let hours = now.getHours();

    const minutes = String(now.getMinutes()).padStart(2, &#x27;0&#x27;);

    const seconds = String(now.getSeconds()).padStart(2, &#x27;0&#x27;);

    const ampm = hours &gt;= 12 ? &#x27;PM&#x27; : &#x27;AM&#x27;;

    hours = hours % 12;

    hours = hours ? hours : 12;

    const formattedHours = String(hours).padStart(2, &#x27;0&#x27;);

    const formattedTime = `${formattedHours}:${minutes}:${seconds} ${ampm}`;



    const customerClock = document.getElementById(&#x27;realTimeClock&#x27;);

    const adminWatch = document.getElementById(&#x27;adminLiveWatch&#x27;);

    if (customerClock) customerClock.innerText = formattedTime;

    if (adminWatch) adminWatch.innerText = formattedTime;

  }

  updateClock();

  setInterval(updateClock, 1000);

}



// ⏳ 12-HOURS EXACT COUNTDOWN

function startSaleTimer() {

  const STORAGE_KEY = &#x27;pag_sale_fixed_end_time&#x27;;

  let endTime = localStorage.getItem(STORAGE_KEY);

  

  if(!endTime) {

    endTime = Date.now() + (12 * 60 * 60 * 1000);

    localStorage.setItem(STORAGE_KEY, endTime.toString());

  } else {

    endTime = parseInt(endTime, 10);

  }



  function tick() {

    const now = Date.now();

    const remaining = Math.max(0, Math.floor((endTime - now) / 1000));

    const clockEl = document.getElementById(&#x27;saleClock&#x27;);

    const labelEl = document.getElementById(&#x27;saleClockLabel&#x27;);



    if(remaining &lt;= 0) {

      showDiwaliBanner();

      return;

    }



    const h = String(Math.floor(remaining / 3600)).padStart(2, &#x27;0&#x27;);

    const m = String(Math.floor((remaining % 3600) / 60)).padStart(2, &#x27;0&#x27;);

    const s = String(remaining % 60).padStart(2, &#x27;0&#x27;);

    if(clockEl) clockEl.innerText = `${h}h : ${m}m : ${s}s`;

  }



  tick();

  setInterval(tick, 1000);

}



// 📍 GPS CURRENT LOCATION DETECTION

function detectCustomerGpsLocation() {

  const btn = document.getElementById(&#x27;btnDetectGps&#x27;);

  if (!navigator.geolocation) {

    showToast(&quot;Geolocation is not supported by your browser.&quot;, &quot;error&quot;);

    return;

  }



  btn.innerHTML = &#x27;⌛ Fetching Location...&#x27;;

  btn.disabled = true;



  navigator.geolocation.getCurrentPosition(

    async (position) =&gt; {

      const lat = position.coords.latitude;

      const lon = position.coords.longitude;

      try {

        const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&amp;lat=${lat}&amp;lon=${lon}`);

        const data = await response.json();

        

        if (data &amp;&amp; data.address) {

          const addr = data.display_name;

          const postcode = data.address.postcode || &#x27;&#x27;;

          

          document.getElementById(&#x27;orderCustAddr&#x27;).value = addr;

          if (postcode) {

            const cleanPost = postcode.replace(/\D/g, &#x27;&#x27;).slice(0, 6);

            if (cleanPost.length === 6) {

              document.getElementById(&#x27;orderCustPin&#x27;).value = cleanPost;

              cartPinEstimate(cleanPost);

            }

          }

          showToast(&quot;Location &amp; Pincode auto-filled successfully!&quot;, &quot;success&quot;);

        } else {

          showToast(&quot;Could not determine street address. Please type manually.&quot;, &quot;error&quot;);

        }

      } catch (err) {

        showToast(&quot;Error retrieving address details from GPS.&quot;, &quot;error&quot;);

      } finally {

        btn.innerHTML = &#x27;📍 Use My Current Location&#x27;;

        btn.disabled = false;

      }

    },

    () =&gt; {

      btn.innerHTML = &#x27;📍 Use My Current Location&#x27;;

      btn.disabled = false;

      showToast(&quot;GPS Permission Denied. Please enter address manually.&quot;, &quot;error&quot;);

    },

    { enableHighAccuracy: true, timeout: 10000 }

  );

}

function initChatSystem() {

  const staffListEl = document.getElementById(&#x27;chatStaffList&#x27;);

  if(!staffListEl) return;



  const isAdmin = currentUser &amp;&amp; (currentUser.role === &quot;Super Admin&quot; || currentUser.role === &quot;Sub-Admin&quot; || currentUser.role === &quot;Master Admin&quot;);

  document.getElementById(&#x27;btnToggleStaffChatBlock&#x27;).style.display = isAdmin ? &#x27;inline-block&#x27; : &#x27;none&#x27;;



  if(isAdmin) {

    if(!teamMembers.length) {

      staffListEl.innerHTML = &#x27;&lt;small style=&quot;color:var(--muted)&quot;&gt;No staff registered yet.&lt;/small&gt;&#x27;;

      return;

    }

    staffListEl.innerHTML = teamMembers.map(m =&gt; `

      &lt;div class=&quot;chat-user-item ${activeChatStaffPhone === m.phone ? &#x27;active&#x27; : &#x27;&#x27;}&quot; onclick=&quot;selectChatStaff(&#x27;${m.phone}&#x27;)&quot;&gt;

        &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;&quot;&gt;

          &lt;b&gt;${m.name}&lt;/b&gt;

          ${m.isChatBlocked ? &#x27;&lt;span style=&quot;color:#dc2626;font-size:10px;font-weight:800;&quot;&gt;🚫 Blocked&lt;/span&gt;&#x27; : &#x27;&#x27;}

        &lt;/div&gt;

        &lt;small style=&quot;color:var(--muted)&quot;&gt;${m.role}&lt;/small&gt;

      &lt;/div&gt;

    `).join(&#x27;&#x27;);



    if(!activeChatStaffPhone &amp;&amp; teamMembers.length) {

      selectChatStaff(teamMembers[0].phone);

    }

  } else {

    staffListEl.innerHTML = `

      &lt;div class=&quot;chat-user-item active&quot;&gt;

        &lt;b&gt;Management Direct Line&lt;/b&gt;&lt;br&gt;

        &lt;small style=&quot;color:var(--muted)&quot;&gt;Logged in: ${currentUser.name}&lt;/small&gt;

      &lt;/div&gt;

    `;

    activeChatStaffPhone = currentUser.phone;

    renderChatView();

  }

}



function selectChatStaff(phone) {

  activeChatStaffPhone = phone;

  initChatSystem();

  renderChatView();

}



function toggleSelectedStaffChatBlock() {

  const staff = teamMembers.find(t =&gt; t.phone === activeChatStaffPhone);

  if(!staff) return;

  staff.isChatBlocked = !staff.isChatBlocked;

  persistTeam();

  initChatSystem();

  renderChatView();

  showToast(`Staff Chat ${staff.isChatBlocked ? &#x27;BLOCKED&#x27; : &#x27;UNBLOCKED&#x27;} for ${staff.name}`, &quot;info&quot;);

}



function renderChatView() {

  const stream = document.getElementById(&#x27;chatMessagesStream&#x27;);

  const header = document.getElementById(&#x27;chatActiveHeader&#x27;);

  const lockBadge = document.getElementById(&#x27;chatLockBadge&#x27;);

  const toggleBtn = document.getElementById(&#x27;btnToggleStaffChatBlock&#x27;);

  const sendInput = document.getElementById(&#x27;chatMsgInput&#x27;);

  const sendBtn = document.getElementById(&#x27;btnSendChat&#x27;);

  if(!stream) return;



  const staff = teamMembers.find(t =&gt; t.phone === activeChatStaffPhone) || currentUser;

  const isChatBlocked = staff &amp;&amp; !!staff.isChatBlocked;

  const isStaffLoggedIn = currentUser &amp;&amp; ![&#x27;Super Admin&#x27;, &#x27;Sub-Admin&#x27;, &#x27;Master Admin&#x27;].includes(currentUser.role);



  if(header &amp;&amp; staff) {

    header.querySelector(&#x27;span&#x27;).innerText = `Task &amp; Chat with: ${staff.name} (${staff.role || &#x27;Staff&#x27;})`;

  }



  if(lockBadge) lockBadge.style.display = isChatBlocked ? &#x27;inline&#x27; : &#x27;none&#x27;;

  if(toggleBtn &amp;&amp; staff) {

    toggleBtn.innerText = isChatBlocked ? &quot;✅ Unblock Staff Chat&quot; : &quot;🚫 Block Staff Chat&quot;;

    toggleBtn.style.background = isChatBlocked ? &quot;#16a34a&quot; : &quot;#dc2626&quot;;

  }



  if(isStaffLoggedIn &amp;&amp; isChatBlocked) {

    sendInput.disabled = true;

    sendBtn.disabled = true;

    sendInput.placeholder = &quot;🚫 Your chat access has been blocked by Admin.&quot;;

  } else {

    sendInput.disabled = false;

    sendBtn.disabled = false;

    sendInput.placeholder = &quot;Type instruction, delivery task, or notice...&quot;;

  }



  const thread = staffChats.filter(c =&gt; c.staffPhone === activeChatStaffPhone);



  if(!thread.length) {

    stream.innerHTML = &#x27;&lt;div style=&quot;color:var(--muted);text-align:center;margin:auto;&quot;&gt;No tasks or messages yet. Type below to send.&lt;/div&gt;&#x27;;

    return;

  }



  stream.innerHTML = thread.map((msg, idx) =&gt; {

    const isFromAdmin = msg.senderRole === &#x27;Admin&#x27;;

    let receiptHtml = &#x27;&#x27;;



    if(msg.status === &#x27;Accepted&#x27;) {

      receiptHtml = &#x27;&lt;span class=&quot;msg-status-receipt receipt-accepted&quot;&gt;✅ Accepted Task&lt;/span&gt;&#x27;;

    } else if(msg.status === &#x27;Seen&#x27;) {

      receiptHtml = &#x27;&lt;span class=&quot;msg-status-receipt receipt-seen&quot;&gt;👁️ Seen by Staff&lt;/span&gt;&#x27;;

    } else {

      receiptHtml = &#x27;&lt;span class=&quot;msg-status-receipt receipt-pending&quot;&gt;🕒 Sent (Unread)&lt;/span&gt;&#x27;;

    }



    let staffActionButtons = &#x27;&#x27;;

    if(isStaffLoggedIn &amp;&amp; msg.senderRole === &#x27;Admin&#x27;) {

      if(msg.status === &#x27;Sent&#x27;) {

        staffActionButtons = `&lt;button style=&quot;background:var(--fk-blue);color:#fff;border:0;padding:3px 8px;border-radius:2px;font-size:10px;cursor:pointer;margin-top:4px;&quot; onclick=&quot;markMessageStatus(${idx}, &#x27;Seen&#x27;)&quot;&gt;👁️ Mark as Seen&lt;/button&gt;`;

      } else if(msg.status === &#x27;Seen&#x27;) {

        staffActionButtons = `&lt;button style=&quot;background:var(--fk-green);color:#fff;border:0;padding:3px 8px;border-radius:2px;font-size:10px;cursor:pointer;margin-top:4px;&quot; onclick=&quot;markMessageStatus(${idx}, &#x27;Accepted&#x27;)&quot;&gt;👍 Accept Task&lt;/button&gt;`;

      }

    }



    return `

      &lt;div class=&quot;chat-bubble ${isFromAdmin ? &#x27;bubble-admin&#x27; : &#x27;bubble-staff&#x27;}&quot;&gt;

        &lt;div&gt;&lt;b&gt;${msg.senderName}:&lt;/b&gt; ${msg.text}&lt;/div&gt;

        &lt;div style=&quot;display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;&quot;&gt;

          &lt;small style=&quot;font-size:9px;opacity:.7;&quot;&gt;${msg.time}&lt;/small&gt;

          ${receiptHtml}

        &lt;/div&gt;

        ${staffActionButtons}

      &lt;/div&gt;

    `;

  }).join(&#x27;&#x27;);



  stream.scrollTop = stream.scrollHeight;

}



function handleSendStaffMessage(e) {

  e.preventDefault();

  const input = document.getElementById(&#x27;chatMsgInput&#x27;);

  const text = input.value.trim();

  if(!text || !activeChatStaffPhone) return;



  const staff = teamMembers.find(t =&gt; t.phone === activeChatStaffPhone) || currentUser;

  const isStaffLoggedIn = currentUser &amp;&amp; ![&#x27;Super Admin&#x27;, &#x27;Sub-Admin&#x27;, &#x27;Master Admin&#x27;].includes(currentUser.role);

  if(isStaffLoggedIn &amp;&amp; staff &amp;&amp; staff.isChatBlocked) {

    showToast(&quot;Cannot send message: Your chat is blocked.&quot;, &quot;error&quot;);

    return;

  }



  const isAdmin = [&#x27;Super Admin&#x27;, &#x27;Sub-Admin&#x27;, &#x27;Master Admin&#x27;].includes(currentUser.role);

  const newMsg = {

    staffPhone: activeChatStaffPhone,

    senderName: currentUser.name,

    senderRole: isAdmin ? &#x27;Admin&#x27; : &#x27;Staff&#x27;,

    text: text,

    time: new Date().toLocaleTimeString(&#x27;en-IN&#x27;, {hour:&#x27;2-digit&#x27;, minute:&#x27;2-digit&#x27;}),

    status: &#x27;Sent&#x27;

  };



  staffChats.push(newMsg);

  persistChats();

  input.value = &#x27;&#x27;;

  renderChatView();

}



function markMessageStatus(idx, status) {

  const staffMsgs = staffChats.filter(c =&gt; c.staffPhone === activeChatStaffPhone);

  if(staffMsgs[idx]) {

    staffMsgs[idx].status = status;

    persistChats();

    renderChatView();

  }

}

function adminSaveTeamMember(e) {

  const name = document.getElementById(&#x27;newTeamName&#x27;).value.trim();

  const rawPhone = document.getElementById(&#x27;newTeamPhone&#x27;).value.trim();

  const phone = cleanPhone(rawPhone);

  const role = document.getElementById(&#x27;newTeamRole&#x27;).value;



  if(phone === ADMIN_PHONE) {

    showToast(&quot;This number is reserved for Super Admin!&quot;, &quot;error&quot;);

    return;

  }



  if(currentUser &amp;&amp; currentUser.role === &quot;Sub-Admin&quot; &amp;&amp; role === &quot;Sub-Admin&quot;) {

    showToast(&quot;Access Denied: Only Super Admin can create Sub-Admins!&quot;, &quot;error&quot;);

    return;

  }



  if(teamMembers.some(t =&gt; cleanPhone(t.phone) === phone)) {

    showToast(&quot;A member with this phone number already exists!&quot;, &quot;error&quot;);

  }



  teamMembers.push({

    id: Date.now(),

    name,

    phone,

    pass,

    role,

    isBlocked: false,

    isChatBlocked: false

  });



  persistTeam();

  initChatSystem();

  e.target.reset();

  showToast(`${role} &quot;${name}&quot; added successfully!`, &quot;success&quot;);

// MULTI-PHOTO UPLOAD HANDLER

function handleMultipleImagesUpload(e) {

  const files = Array.from(e.target.files).slice(0, 5);

  currentMultiUploadedImages = [];

  const strip = document.getElementById(&#x27;multiPreviewStrip&#x27;);

  strip.innerHTML = &#x27;&#x27;;



  if(!files.length) {

    strip.innerHTML = &#x27;&lt;span style=&quot;font-size:11px;color:var(--muted);padding:8px;&quot;&gt;No images uploaded yet.&lt;/span&gt;&#x27;;

    return;

  }



  files.forEach((file, index) =&gt; {

    const reader = new FileReader();

    reader.onload = function(evt) {

      currentMultiUploadedImages.push(evt.target.result);

      const img = document.createElement(&#x27;img&#x27;);

      img.src = evt.target.result;

      img.title = `Image ${index + 1}: ${file.name}`;

      strip.appendChild(img);

    };

    reader.readAsDataURL(file);

  });

}



function handleUrlImagePreview(url) {

  const trimmed = url.trim();

  const strip = document.getElementById(&#x27;multiPreviewStrip&#x27;);

  if(trimmed) {

    currentMultiUploadedImages = [trimmed];

    strip.innerHTML = `&lt;img src=&quot;${trimmed}&quot; title=&quot;Primary Image Link&quot; style=&quot;width:50px;height:50px;object-fit:contain;border:1px solid #ddd;&quot;&gt;`;

  }

}



function calculateDiscountPreview() {

  const orig = Number(document.getElementById(&#x27;newProdOrig&#x27;).value) || 0;

  const price = Number(document.getElementById(&#x27;newProdPrice&#x27;).value) || 0;

  const prev = document.getElementById(&#x27;discountPreviewText&#x27;);

  if(orig &gt; 0 &amp;&amp; price &gt; 0 &amp;&amp; orig &gt; price) {

    const disc = Math.round((1 - price / orig) * 100);

    prev.innerText = `Discount: ${disc}% OFF`;

  } else {

    prev.innerText = `Discount: 0% OFF`;

  }

}



function adminSaveProduct(e) {

  e.preventDefault();

  const name = document.getElementById(&#x27;newProdName&#x27;).value.trim();

  let cat = document.getElementById(&#x27;newProdCat&#x27;).value;

  

  if(cat === &#x27;Other&#x27;) {

    const customCat = document.getElementById(&#x27;newProdCustomCat&#x27;).value.trim();

    if(!customCat) {

      showToast(&quot;Please type a custom category name!&quot;, &quot;error&quot;);

      return;

    }

    cat = customCat;

  }



  const orig = Number(document.getElementById(&#x27;newProdOrig&#x27;).value);

  const price = Number(document.getElementById(&#x27;newProdPrice&#x27;).value);

  const stock = Number(document.getElementById(&#x27;newProdStock&#x27;).value) || 0;

  

  if(price &gt; orig) {

    showToast(&quot;Selling price cannot be greater than original MRP price!&quot;, &quot;error&quot;);

    return;

  }



  const primaryImage = (currentMultiUploadedImages.length &gt; 0) ? currentMultiUploadedImages[0] : &quot;https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=400&quot;;

  const galleryImages = currentMultiUploadedImages.slice(1);



  const newProduct = {

    id: Date.now(),

    name,

    cat,

    price,

    orig,

    stock: stock,

    rating: 4.5,

    reviews: 1,

    img: primaryImage,

    gallery: galleryImages,

    specs: textToSpecs((document.getElementById(&#x27;newProdSpecs&#x27;) || {}).value || &#x27;&#x27;),

    desc: &#x27;&#x27;

  };



  catalog.unshift(newProduct);

  persistCatalog();



  e.target.reset();

  currentMultiUploadedImages = [];

  document.getElementById(&#x27;multiPreviewStrip&#x27;).innerHTML = &#x27;&lt;span style=&quot;font-size:11px;color:var(--muted);padding:8px;&quot;&gt;No images uploaded yet.&lt;/span&gt;&#x27;;

  toggleOtherCatInput(&#x27;Helmets&#x27;);

  calculateDiscountPreview();

  showToast(`Product &quot;${name}&quot; added with ${stock} inventory units!`, &quot;success&quot;);

}

function openOrderDetailsModal(idx) {

  const o = orders[idx];

  if(!o) return;

  const statusNames = [&quot;&quot;, &quot;Order Placed&quot;, &quot;Packed&quot;, &quot;Out for Delivery&quot;, &quot;Delivered&quot;];

  const isSuperAdmin = currentUser &amp;&amp; (currentUser.role === &quot;Super Admin&quot; || currentUser.role === &quot;Master Admin&quot;);



  document.getElementById(&#x27;orderDetailModalTitle&#x27;).innerText = `📦 Order Invoice: ${o.id}`;



  let parsedItems = [];



  if (o.itemList &amp;&amp; Array.isArray(o.itemList) &amp;&amp; o.itemList.length &gt; 0) {

    parsedItems = o.itemList.map(item =&gt; {

      const match = catalog.find(p =&gt; p.id === item.id || p.name.toLowerCase() === item.name.toLowerCase());

      return {

        name: item.name,

        qty: item.qty || 1,

        price: item.price || (match ? match.price : 0),

        img: item.img || (match ? match.img : &#x27;https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=100&#x27;)

      };

    });

  } 

  else if (o.items &amp;&amp; typeof o.items === &#x27;string&#x27;) {

    const rawParts = o.items.split(&#x27;,&#x27;);

    parsedItems = rawParts.map(part =&gt; {

      const trimmed = part.trim();

      let itemName = trimmed;

      let qty = 1;



      const qtyMatch = trimmed.match(/(.+)\(Qty:\s*(\d+)\)/i);

      if (qtyMatch) {

        itemName = qtyMatch[1].trim();

        qty = parseInt(qtyMatch[2], 10) || 1;

      const match = catalog.find(p =&gt; itemName.toLowerCase().includes(p.name.toLowerCase()) || p.name.toLowerCase().includes(itemName.toLowerCase()));



      return {

        name: itemName,

        qty: qty,

        price: match ? match.price : 0,

        img: match ? match.img : &#x27;https://images.unsplash.com/photo-1558981403-c5f9899a28bc?w=100&#x27;

          &lt;div style=&quot;font-size:12px;color:#64748b;margin-top:2px;&quot;&gt;Rate: ₹${item.price.toLocaleString(&#x27;en-IN&#x27;)} each ${item.price &gt; 0 ? `· Subtotal: &lt;b&gt;₹${(item.qty * item.price).toLocaleString(&#x27;en-IN&#x27;)}&lt;/b&gt;` : &#x27;&#x27;}&lt;/div&gt;

        &lt;/div&gt;

function renderAdminUsersTable() {

  if(!tbody) return;
  badge.innerText = `${users.length} Customers`;

  if(!users.length) {

    return;
  }

  tbody.innerHTML = users.map((u, idx) =&gt; {
    const isPerm = !!u.isPermanentBlocked;
    const isLocked2h = u.lockedUntil &amp;&amp; Date.now() &lt; u.lockedUntil;
    const isBlocked = !!u.isBlocked;
    const failedCount = u.failedAttempts || 0;

    let statusPill = &#x27;&lt;span style=&quot;background:#22c55e;color:#fff;padding:2px 6px;border-radius:8px;font-weight:700;font-size:10px;&quot;&gt;ACTIVE&lt;/span&gt;&#x27;;
    if(isPerm) {

    } else if(isLocked2h) {
      const rem = Math.ceil((u.lockedUntil - Date.now()) / (1000 * 60));
      statusPill = `&lt;span style=&quot;background:#ea580c;color:#fff;padding:2px 6px;border-radius:8px;font-weight:800;font-size:10px;&quot;&gt;LOCKED (${rem}m left)&lt;/span&gt;`;
    } else if(isBlocked) {
      statusPill = &#x27;&lt;span style=&quot;background:#ef4444;color:#fff;padding:2px 6px;border-radius:8px;font-weight:700;font-size:10px;&quot;&gt;BLOCKED&lt;/span&gt;&#x27;;
    }

    return `
      &lt;tr style=&quot;${isPerm || isLocked2h || isBlocked ? &#x27;background:#fee2e2;&#x27; : &#x27;&#x27;}&quot;&gt;
        &lt;td&gt;&lt;b&gt;${esc(u.name)}&lt;/b&gt;&lt;/td&gt;
        &lt;td&gt;${esc(u.email || &#x27;&lt;span style=&quot;color:var(--muted)&quot;&gt;None&lt;/span&gt;&#x27;)}&lt;/td&gt;
        &lt;td&gt;${esc(u.phone)}&lt;/td&gt;
        &lt;td&gt;&lt;code style=&quot;background:#f1f5f9;padding:2px 4px;border-radius:2px;&quot;&gt;${esc(u.pass)}&lt;/code&gt;&lt;/td&gt;
        &lt;td&gt;${statusPill}&lt;/td&gt;
        &lt;td&gt;&lt;small style=&quot;color:${failedCount &gt;= 3 ? &#x27;#dc2626&#x27; : &#x27;#64748b&#x27;};font-weight:700;&quot;&gt;Failed: ${failedCount}/10&lt;/small&gt;&lt;/td&gt;
        &lt;td style=&quot;white-space:nowrap;&quot;&gt;
          ${(isPerm || isLocked2h || isBlocked) ? `&lt;button type=&quot;button&quot; class=&quot;btn-override-pass&quot; style=&quot;background:#16a34a;margin-right:3px;&quot; onclick=&quot;adminUnlockUser(&#x27;${u.phone}&#x27;)&quot;&gt;🔓 Unlock&lt;/button&gt;` : &#x27;&#x27;}

        &lt;/td&gt;

  }).join(&#x27;&#x27;);
}

function handleSaveMandatorySecurity(e) {

  e.preventDefault();

  const q = document.getElementById(&#x27;mandSecQ&#x27;).value;

  const a = document.getElementById(&#x27;mandSecA&#x27;).value.trim().toLowerCase();

  const msg = document.getElementById(&#x27;mandSecMsg&#x27;);



  if(!q || !a) {

    msg.className = &quot;auth-msg err&quot;;

    msg.innerText = &quot;Please select a question and provide an answer.&quot;;

    return;

  }



  currentUser.secQuestion = q;

  currentUser.secAnswer = a;



  const uIdx = users.findIndex(u =&gt; cleanPhone(u.phone) === cleanPhone(currentUser.phone));

  if(uIdx &gt; -1) {

    users[uIdx].secQuestion = q;

    users[uIdx].secAnswer = a;

    persistUsers();

  }

  persistCurrentUser();



  msg.className = &quot;auth-msg ok&quot;;

  msg.innerText = &quot;Security Question successfully configured!&quot;;

  setTimeout(() =&gt; { closeAuthModal(); }, 1000);

}

let loginSecurity = {};
try { loginSecurity = JSON.parse(localStorage.getItem(&#x27;pag_login_security&#x27;)) || {}; } catch(e){ loginSecurity = {}; }
function persistLoginSecurity() { localStorage.setItem(&#x27;pag_login_security&#x27;, JSON.stringify(loginSecurity)); }

function getSecurityRecord(identifier) {
  const key = String(identifier || &#x27;&#x27;).trim().toLowerCase();
  if(!loginSecurity[key]) {
    loginSecurity[key] = { attempts: 0, lockedUntil: 0, isPermanentBlocked: false };
  }
  return loginSecurity[key];
}

function adminUnlockUser(phone) {
  const clean = cleanPhone(phone);
  const u = users.find(x =&gt; cleanPhone(x.phone) === clean);
  if(u) {
    u.failedAttempts = 0;
    u.lockedUntil = 0;
    u.isBlocked = false;
    u.isPermanentBlocked = false;
    persistUsers();
  }
  if(loginSecurity[clean]) {
    loginSecurity[clean].attempts = 0;
    loginSecurity[clean].lockedUntil = 0;
    loginSecurity[clean].isPermanentBlocked = false;
  }
  if(u &amp;&amp; u.email &amp;&amp; loginSecurity[u.email.toLowerCase()]) {
    loginSecurity[u.email.toLowerCase()].attempts = 0;
    loginSecurity[u.email.toLowerCase()].lockedUntil = 0;
    loginSecurity[u.email.toLowerCase()].isPermanentBlocked = false;
  }
  persistLoginSecurity();
  renderAdminUsersTable();
  renderMasterPanel();
  showToast(`Account for ${u ? u.name : phone} has been UNLOCKED successfully!`, &quot;success&quot;);
}

let loginSecurity = {};

function persistLoginSecurity() { localStorage.setItem(&#x27;pag_login_security&#x27;, JSON.stringify(loginSecurity)); }

function getSecurityRecord(identifier) {
  const key = String(identifier || &#x27;&#x27;).trim().toLowerCase();
  if(!loginSecurity[key]) {
    loginSecurity[key] = { attempts: 0, lockedUntil: 0, isPermanentBlocked: false };
  }
  return loginSecurity[key];
}

function adminUnlockUser(phone) {
  const clean = cleanPhone(phone);
  const u = users.find(x =&gt; cleanPhone(x.phone) === clean);
  if(u) {
    u.failedAttempts = 0;
    u.lockedUntil = 0;
    u.isBlocked = false;
    u.isPermanentBlocked = false;
    persistUsers();
  }
  if(loginSecurity[clean]) {
    loginSecurity[clean].attempts = 0;
    loginSecurity[clean].lockedUntil = 0;
    loginSecurity[clean].isPermanentBlocked = false;
  }
  if(u &amp;&amp; u.email &amp;&amp; loginSecurity[u.email.toLowerCase()]) {
    loginSecurity[u.email.toLowerCase()].attempts = 0;
    loginSecurity[u.email.toLowerCase()].lockedUntil = 0;
    loginSecurity[u.email.toLowerCase()].isPermanentBlocked = false;
  }
  persistLoginSecurity();
  renderAdminUsersTable();
  renderMasterPanel();
  showToast(`Account for ${u ? u.name : phone} has been UNLOCKED successfully!`, &quot;success&quot;);
}

  // 1. SUPER ADMIN CHECK
  if(cleanedId === ADMIN_PHONE &amp;&amp; pass === ADMIN_PASS) {
    currentUser = { name: &quot;Shop Owner (Super Admin)&quot;, phone: ADMIN_PHONE, isAdmin: true, role: &quot;Super Admin&quot; };
    persistCurrentUser();
    msg.className = &quot;auth-msg ok&quot;;
    msg.innerText = &quot;Welcome Boss! Opening Super Admin Portal...&quot;;
    showToast(&quot;Welcome Boss! Opening Workspace...&quot;, &quot;success&quot;);
    setTimeout(() =&gt; {
      openAdminPortal(&quot;Super Admin&quot;);
    }, 600);
    return;
  }

  // Security checks for account lock
  const secKey = cleanedId || rawId.toLowerCase();
  const sec = getSecurityRecord(secKey);

  try { users = JSON.parse(localStorage.getItem(&#x27;pag_users_db&#x27;)) || []; } catch(err){ users = []; }
  try { teamMembers = JSON.parse(localStorage.getItem(&#x27;pag_team_db&#x27;)) || []; } catch(err){ teamMembers = []; }

  const matchedUser = users.find(u =&gt; {
    const userCleanPhone = cleanPhone(u.phone);
    return (userCleanPhone &amp;&amp; userCleanPhone === cleanedId) || 
           (u.email &amp;&amp; u.email.toLowerCase() === rawId.toLowerCase());
  });

  const teamUser = teamMembers.find(t =&gt; (cleanPhone(t.phone) === cleanedId || (t.email &amp;&amp; t.email.toLowerCase() === rawId.toLowerCase())));

  // Check Permanent Block (10+ attempts)
  const isPerm = (sec &amp;&amp; sec.isPermanentBlocked) || (matchedUser &amp;&amp; matchedUser.isPermanentBlocked);
  if(isPerm) {
    msg.className = &quot;auth-msg err&quot;;
    msg.innerHTML = `🚫 &lt;b&gt;Account Permanently Blocked:&lt;/b&gt; 10 baar se zyada galat password enter karne ke karan ye account block hai.&lt;br&gt;Ise sirf &lt;b&gt;Admin ya Master Login&lt;/b&gt; se hi unlock kiya ja sakta hai.&lt;br&gt;&lt;br&gt;👉 Support ke liye Mail Support khola ja raha hai...`;
    showToast(&quot;Account Permanently Blocked. Opening Support...&quot;, &quot;error&quot;);
    setTimeout(() =&gt; {
      closeAuthModal();
      openMailSupportModal();
    }, 1800);
    return;
  }

  // Check 2-Hour Lock (3+ attempts)
  const lockTime = Math.max((sec &amp;&amp; sec.lockedUntil) || 0, (matchedUser &amp;&amp; matchedUser.lockedUntil) || 0);
  if(lockTime &gt; Date.now()) {
    const remMin = Math.ceil((lockTime - Date.now()) / (1000 * 60));
    const hrs = Math.floor(remMin / 60);
    const mins = remMin % 60;
    const timeStr = hrs &gt; 0 ? `${hrs} Ghante ${mins} Minute` : `${mins} Minute`;
    msg.className = &quot;auth-msg err&quot;;
    msg.innerHTML = `⏳ &lt;b&gt;Account Temporarily Locked:&lt;/b&gt; 3 baar se zyada galat password enter karne ke karan ye account &lt;b&gt;2 Ghante&lt;/b&gt; ke liye lock hai.&lt;br&gt;Kripya &lt;b&gt;${timeStr}&lt;/b&gt; baad prayas karein ya Admin se contact karein.`;
    showToast(`Account locked for 2 hours! (${timeStr} remaining)`, &quot;error&quot;);
    return;
  }

  // 2. SUB-ADMIN &amp; STAFF CHECK WITH BLOCK CHECK
  if(teamUser) {
    if(teamUser.isBlocked) {
      msg.className = &quot;auth-msg err&quot;;
      msg.innerHTML = &quot;🚫 &lt;b&gt;Account Suspended:&lt;/b&gt; Your staff account has been blocked by Super Admin.&quot;;
      showToast(&quot;Staff account suspended.&quot;, &quot;error&quot;);
      return;
    }

    if(teamUser.pass === pass) {
      sec.attempts = 0; sec.lockedUntil = 0; sec.isPermanentBlocked = false; persistLoginSecurity();
      currentUser = { name: teamUser.name, phone: teamUser.phone, isAdmin: true, role: teamUser.role };
      persistCurrentUser();
      msg.className = &quot;auth-msg ok&quot;;
      msg.innerText = `Welcome ${teamUser.name}! Opening ${teamUser.role} Console...`;
      showToast(`Welcome ${teamUser.name}! Opening Workspace...`, &quot;success&quot;);
      setTimeout(() =&gt; { openAdminPortal(teamUser.role); }, 600);
      return;
    }
  }

  // 3. REGULAR CUSTOMER CHECK
  if(matchedUser) {
    if(matchedUser.isBlocked) {
      msg.className = &quot;auth-msg err&quot;;
      msg.innerHTML = &quot;🚫 &lt;b&gt;Account Suspended:&lt;/b&gt; Your account has been blocked by Shop Admin. Please use Support for help.&quot;;
      showToast(&quot;Account suspended by Admin.&quot;, &quot;error&quot;);
      return;
    }

    if(matchedUser.pass === pass) {
      sec.attempts = 0; sec.lockedUntil = 0; sec.isPermanentBlocked = false;
      persistLoginSecurity();
      matchedUser.failedAttempts = 0;
      matchedUser.lockedUntil = 0;
      matchedUser.isPermanentBlocked = false;
      persistUsers();

      currentUser = matchedUser;
      persistCurrentUser();
      msg.className = &quot;auth-msg ok&quot;;
      msg.innerText = &quot;Login successful!&quot;;
      showToast(`Welcome back, ${matchedUser.name}!`, &quot;success&quot;);
      setTimeout(() =&gt; {
        closeAuthModal();
        checkUserSecurityStatus();
      }, 600);
      return;
    }
  }

  // FAILED LOGIN ATTEMPT HANDLING
  sec.attempts = (sec.attempts || 0) + 1;
  const currentAttempts = sec.attempts;

  if(matchedUser) {
    matchedUser.failedAttempts = currentAttempts;
  }

  // Rule 2: &gt; 10 Failed Attempts -&gt; Permanent Block + Open Support Modal
  if(currentAttempts &gt;= 10) {
    sec.isPermanentBlocked = true;
    if(matchedUser) {
      matchedUser.isPermanentBlocked = true;
      matchedUser.isBlocked = true;
      persistUsers();
    }
    persistLoginSecurity();

    msg.className = &quot;auth-msg err&quot;;
    msg.innerHTML = `🚫 &lt;b&gt;10 Baar Galat Password!&lt;/b&gt;&lt;br&gt;Suraksha ke karan aapka account &lt;b&gt;Permanently Block&lt;/b&gt; ho gaya hai.&lt;br&gt;Ise sirf &lt;b&gt;Admin ya Master Login&lt;/b&gt; se hi unlock kiya ja sakta hai.&lt;br&gt;Support modal khol rahe hain...`;
    showToast(&quot;10 Failed Attempts: Permanently Blocked!&quot;, &quot;error&quot;);
    setTimeout(() =&gt; {
      closeAuthModal();
      openMailSupportModal();
    }, 1800);
    return;
  }

  // Rule 1: &gt; 3 Failed Attempts -&gt; 2 Hours Lockout
  if(currentAttempts &gt;= 3) {
    sec.lockedUntil = Date.now() + (2 * 60 * 60 * 1000); // 2 hours
    if(matchedUser) {
      matchedUser.lockedUntil = sec.lockedUntil;
      persistUsers();
    }
    persistLoginSecurity();

    msg.className = &quot;auth-msg err&quot;;
    msg.innerHTML = `⚠️ &lt;b&gt;3 Baar Galat Password!&lt;/b&gt;&lt;br&gt;Suraksha niyam ke anusar aapka account &lt;b&gt;2 Ghante ke liye Block&lt;/b&gt; kar diya gaya hai.`;
    showToast(&quot;Account blocked for 2 hours!&quot;, &quot;error&quot;);
    return;
  }

  persistLoginSecurity();
  if(matchedUser) persistUsers();

  const attemptsLeft = 3 - currentAttempts;
  msg.className = &quot;auth-msg err&quot;;
  msg.innerHTML = `❌ Galat Password ya Mobile/Email! (Attempt ${currentAttempts}/3)&lt;br&gt;&lt;small style=&quot;color:#d97706;font-weight:600;&quot;&gt;⚠️ 3 baar galat hone par 2 ghante aur 10 baar galat hone par permanent block ho jayega.&lt;/small&gt;`;
  showToast(`Invalid credentials (${currentAttempts}/3 attempts)`, &quot;error&quot;);
}

function makeButtonHtml(id, qty, stock = 10) {

  if (stock &lt;= 0) {

    return `&lt;button class=&quot;btn-add-cart&quot; disabled&gt;🔴 Out of Stock&lt;/button&gt;`;

  }

  if(qty &gt; 0) {

      &lt;div class=&quot;qty-stepper&quot;&gt;

        &lt;button onclick=&quot;updateItemQuantity(${id}, -1)&quot;&gt;−&lt;/button&gt;

        &lt;span&gt;${qty} in Cart&lt;/span&gt;

        &lt;button onclick=&quot;handleAddToCartAnimation(${id}, this)&quot;&gt;+&lt;/button&gt;

      &lt;/div&gt;

    `;

  }

  return `

    &lt;button class=&quot;btn-add-cart&quot; onclick=&quot;handleAddToCartAnimation(${id}, this)&quot;&gt;

      &lt;span&gt;🛒&lt;/span&gt; Add to Cart

    &lt;/button&gt;

  `;

}



// 🔒 STRICT LOGIN CHECK BEFORE ADD TO CART

function handleAddToCartAnimation(id, btn) {

  if (!currentUser) {

    showToast(&quot;Kripya pehle Login karein product cart me add karne ke liye!&quot;, &quot;error&quot;);

    openAuthModal(&#x27;login&#x27;);

    return;

  }



  const product = catalog.find(p =&gt; p.id === id);

  if(!product || product.stock &lt;= 0) {

    showToast(&quot;Product is Out of Stock!&quot;, &quot;error&quot;);

    return;

  }



  const exist = cart.find(c =&gt; c.id === id);

  if(exist) {

    if(exist.qty &gt;= product.stock) {

      showToast(`Only ${product.stock} units available in stock!`, &quot;error&quot;);

      return;

    }

    exist.qty += 1;

  } else {

    cart.push({...product, qty: 1});

  }



  triggerFly(btn);

  persistCart();

  showToast(`Added to Cart: ${product.name}`, &quot;success&quot;);

}



function triggerFly(startElem) {

  const target = document.getElementById(&#x27;cartTriggerBtn&#x27;);

  if(!startElem || !target) return;

  const sRect = startElem.getBoundingClientRect();

  const tRect = target.getBoundingClientRect();



  const ball = document.createElement(&#x27;div&#x27;);

  ball.className = &#x27;fly-item&#x27;;

  ball.innerText = &#x27;+1&#x27;;

  ball.style.left = `${sRect.left + (sRect.width / 2) - 10}px`;

  ball.style.top = `${sRect.top}px`;

  document.body.appendChild(ball);



  requestAnimationFrame(() =&gt; {

    ball.style.left = `${tRect.left + (tRect.width / 2) - 10}px`;

    ball.style.top = `${tRect.top + (tRect.height / 2) - 10}px`;

    ball.style.transform = &#x27;scale(1.2)&#x27;;

    ball.style.opacity = &#x27;0.3&#x27;;

  });



  setTimeout(() =&gt; ball.remove(), 560);

}



function updateItemQuantity(id, delta) {

  if (!currentUser) {

    showToast(&quot;Kripya pehle Login karein!&quot;, &quot;error&quot;);

    openAuthModal(&#x27;login&#x27;);

    return;

  }



  const idx = cart.findIndex(c =&gt; c.id === id);

  if(idx &gt; -1) {

    const product = catalog.find(p =&gt; p.id === id);

    if(delta &gt; 0 &amp;&amp; product &amp;&amp; cart[idx].qty &gt;= product.stock) {

      showToast(`Max available stock reached: ${product.stock} units`, &quot;error&quot;);

      return;

    }

    cart[idx].qty += delta;

    if(cart[idx].qty &lt;= 0) cart.splice(idx, 1);

    persistCart();

  }

}

function processOrderPlacement(e) {

  e.preventDefault();



  if (!currentUser) {

    showToast(&quot;Kripya pehle Login karein order place karne ke liye!&quot;, &quot;error&quot;);

    openAuthModal(&#x27;login&#x27;);

    return;

  }



  const name = document.getElementById(&#x27;orderCustName&#x27;).value.trim();

  const rawPhone = document.getElementById(&#x27;orderCustPhone&#x27;).value.trim();

  const phone = cleanPhone(rawPhone);

  const addr = document.getElementById(&#x27;orderCustAddr&#x27;).value.trim();

  const pincode = document.getElementById(&#x27;orderCustPin&#x27;).value.trim();

  const payment = document.querySelector(&#x27;input[name=&quot;payOption&quot;]:checked&#x27;).value;



  const pinRegex = /^[1-9][0-9]{5}$/;

  if (!pinRegex.test(pincode)) {

    showToast(&quot;Invalid Pincode! Please enter a valid 6-digit Indian Postal Code.&quot;, &quot;error&quot;);

    document.getElementById(&#x27;orderCustPin&#x27;).focus();

    return;

  }



  try { users = JSON.parse(localStorage.getItem(&#x27;pag_users_db&#x27;)) || []; } catch(err){ users = []; }

  const matchedUser = users.find(u =&gt; cleanPhone(u.phone) === phone);

  if(matchedUser &amp;&amp; matchedUser.isBlocked) {

    showToast(&quot;Order Declined: Your account is blocked by Shop Admin.&quot;, &quot;error&quot;);

    return;

  }



  for (let c of cart) {

    const prod = catalog.find(p =&gt; p.id === c.id);

    if (!prod || prod.stock &lt; c.qty) {

      showToast(`Cannot place order: &quot;${c.name}&quot; has only ${prod ? prod.stock : 0} units in stock!`, &quot;error&quot;);

      return;

    }

  }



  for (let c of cart) {

    const prod = catalog.find(p =&gt; p.id === c.id);

    if (prod) {

      prod.stock = Math.max(0, prod.stock - c.qty);

    }

  }

  persistCatalog();



  const orderId = &#x27;PAG-&#x27; + Math.floor(100000 + Math.random() * 900000);

  const deliveryPin = Math.floor(1000 + Math.random() * 9000);

  const total = cart.reduce((acc, it) =&gt; acc + (it.price * it.qty), 0);

  const itemsText = cart.map(i =&gt; `${i.name} (Qty: ${i.qty})`).join(&#x27;, &#x27;);



  const richItemList = cart.map(i =&gt; ({

    id: i.id,

    name: i.name,

    qty: i.qty,

    price: i.price,

    img: i.img

  }));



  const newOrder = {

    id: orderId,

    customerName: name,

    customerPhone: rawPhone,

    address: addr,

    pincode: pincode,

    items: itemsText,

    itemList: richItemList,

    totalPayable: total,

    paymentMethod: payment,

    date: new Date().toLocaleDateString(&#x27;en-IN&#x27;, {day:&#x27;numeric&#x27;, month:&#x27;short&#x27;, year:&#x27;numeric&#x27;, hour:&#x27;2-digit&#x27;, minute:&#x27;2-digit&#x27;}),

    statusStep: 1,

    deliveryPin: deliveryPin,

    etaText: etaTextFor(pincode)

  };



  orders.unshift(newOrder);

  persistOrders();



  cart = [];

  persistCart();



  showToast(&quot;Order Placed Successfully! Inventory updated.&quot;, &quot;success&quot;);



  window.__pagLastOrderText = `Hello PAG Moters! I placed an order.\n\n*Order ID:* ${orderId}\n*Name:* ${name}\n*Phone:* ${rawPhone}\n*Address:* ${addr}\n*PIN:* ${pincode}\n*Items:* ${itemsText}\n*Total:* ₹${total}\n*Payment:* ${payment}`;

  const body = document.getElementById(&#x27;cartBody&#x27;);

  body.innerHTML = `

    &lt;div class=&quot;success-screen&quot;&gt;

      &lt;div class=&quot;icon&quot;&gt;✅&lt;/div&gt;

      &lt;h2 style=&quot;margin:0 0 6px;color:#212121;font-size:18px;&quot;&gt;Order Placed Successfully!&lt;/h2&gt;

      &lt;p style=&quot;color:#555;font-size:12px;margin:0 0 8px;&quot;&gt;Thank you for shopping with PAG Moters.&lt;/p&gt;

      

      &lt;div class=&quot;order-pill&quot;&gt;ORDER ID: ${orderId}&lt;/div&gt;



      &lt;div class=&quot;delivery-code-pill&quot;&gt;

        &lt;span&gt;🔐 Secret Delivery Code:&lt;/span&gt;

        &lt;span class=&quot;code-num&quot;&gt;${deliveryPin}&lt;/span&gt;

      &lt;/div&gt;

      &lt;small style=&quot;color:#d97706;display:block;margin-bottom:8px;font-size:11px;&quot;&gt;⚠️ Keep this 4-digit PIN secret. Delivery person will ask for this code when handing over your parcel.&lt;/small&gt;



      &lt;div style=&quot;text-align:left;background:#f9f9f9;border:1px solid #e0e0e0;padding:10px;border-radius:4px;font-size:12px;line-height:1.5;margin:10px 0;&quot;&gt;

        &lt;div&gt;&lt;b&gt;Name:&lt;/b&gt; ${name} (${rawPhone})&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Address:&lt;/b&gt; ${addr}&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Pincode:&lt;/b&gt; ${pincode}&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Estimated Delivery:&lt;/b&gt; ${etaTextFor(pincode)}&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Items:&lt;/b&gt; ${itemsText}&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Total Amount:&lt;/b&gt; ₹${total.toLocaleString(&#x27;en-IN&#x27;)}&lt;/div&gt;

        &lt;div&gt;&lt;b&gt;Payment Mode:&lt;/b&gt; ${payment}&lt;/div&gt;

      &lt;/div&gt;



      &lt;a class=&quot;btn-wa-order&quot; href=&quot;javascript:void(0)&quot; onclick=&quot;openShopWhatsApp(window.__pagLastOrderText)&quot;&gt;

        Send Order on WhatsApp 💬

      &lt;/a&gt;



      &lt;button onclick=&quot;toggleCartDrawer(false); openMyOrdersModal();&quot; class=&quot;btn-add-cart&quot; style=&quot;margin-top:10px;&quot;&gt;View in My Orders&lt;/button&gt;

    &lt;/div&gt;

  `;

}

function esc(s) {

  return String(s == null ? &#x27;&#x27; : s).replace(/[&amp;&lt;&gt;&quot;&#x27;]/g, c =&gt; ({&#x27;&amp;&#x27;:&#x27;&amp;amp;&#x27;,&#x27;&lt;&#x27;:&#x27;&amp;lt;&#x27;,&#x27;&gt;&#x27;:&#x27;&amp;gt;&#x27;,&#x27;&quot;&#x27;:&#x27;&amp;quot;&#x27;,&quot;&#x27;&quot;:&#x27;&amp;#39;&#x27;}[c]));

}

function nl2br(s) { return esc(s).replace(/\n/g, &#x27;&lt;br&gt;&#x27;); }

function mailNowText() {

  return new Date().toLocaleDateString(&#x27;en-IN&#x27;, {day:&#x27;numeric&#x27;, month:&#x27;short&#x27;, hour:&#x27;2-digit&#x27;, minute:&#x27;2-digit&#x27;});

}

function newMailId() { return &#x27;MAIL-&#x27; + Math.floor(100000 + Math.random() * 900000); }

function persistMails() {

  localStorage.setItem(&#x27;pag_mail_db&#x27;, JSON.stringify(mails));

  renderMailAdmin();

}

function handleSendSupportMail(e) {

  e.preventDefault();

  const name = document.getElementById(&#x27;msName&#x27;).value.trim();

  const email = document.getElementById(&#x27;msEmail&#x27;).value.trim().toLowerCase();

  const phone = cleanPhone(document.getElementById(&#x27;msPhone&#x27;).value.trim());

  const subject = document.getElementById(&#x27;msSubject&#x27;).value.trim();

  const body = document.getElementById(&#x27;msBody&#x27;).value.trim();

  if(!name || !email || !subject || !body) {

    showToast(&quot;Please fill all required fields.&quot;, &quot;error&quot;);

    return;

  }

  try { mails = JSON.parse(localStorage.getItem(&#x27;pag_mail_db&#x27;)) || []; } catch(err){ mails = []; }

  mails.push({

    id: newMailId(),

    direction: &#x27;in&#x27;,

    fromName: name,

    fromEmail: email,

    fromPhone: phone,

    subject: subject,

    body: body,

    date: mailNowText(),

    ts: Date.now(),

    read: false,

    replied: false

  });

  persistMails();

  document.getElementById(&#x27;msSubject&#x27;).value = &#x27;&#x27;;

  document.getElementById(&#x27;msBody&#x27;).value = &#x27;&#x27;;

  document.getElementById(&#x27;mailLookup&#x27;).value = email;

  showToast(&quot;Mail sent to PAG Moters! Reply &#x27;My Mails&#x27; me milega.&quot;, &quot;success&quot;);

  switchMailSupportTab(&#x27;inbox&#x27;);

function renderMyMails() {

  const box = document.getElementById(&#x27;myMailsList&#x27;);

  try { mails = JSON.parse(localStorage.getItem(&#x27;pag_mail_db&#x27;)) || []; } catch(err){ mails = []; }

  const key = (document.getElementById(&#x27;mailLookup&#x27;).value || &#x27;&#x27;).trim().toLowerCase();

  if(!key) {

    box.innerHTML = &#x27;&lt;div class=&quot;mail-empty&quot;&gt;Apna Email ya Mobile Number daal kar &quot;Show&quot; dabayein.&lt;/div&gt;&#x27;;

    return;

  }

  const isEmail = key.includes(&#x27;@&#x27;);

  const ph = cleanPhone(key);

  const match = (email, phone) =&gt; isEmail ? (email || &#x27;&#x27;).toLowerCase() === key : (ph &amp;&amp; cleanPhone(phone) === ph);



  const ins = mails.filter(m =&gt; m.direction === &#x27;in&#x27; &amp;&amp; match(m.fromEmail, m.fromPhone)).sort((a, b) =&gt; b.ts - a.ts);

  const outs = mails.filter(m =&gt; m.direction === &#x27;out&#x27; &amp;&amp; match(m.toEmail, m.toPhone));

  const inIds = new Set(ins.map(i =&gt; i.id));

  const standalone = outs.filter(o =&gt; !inIds.has(o.threadId)).sort((a, b) =&gt; b.ts - a.ts);



  if(!ins.length &amp;&amp; !standalone.length) {

    box.innerHTML = &#x27;&lt;div class=&quot;mail-empty&quot;&gt;📭 Is email/mobile par koi mail nahi mila.&lt;/div&gt;&#x27;;

    return;

  }



  const sentCards = ins.map(m =&gt; {

    const replies = outs.filter(o =&gt; o.threadId === m.id).sort((a, b) =&gt; a.ts - b.ts);

    return `

      &lt;div class=&quot;mail-card&quot;&gt;

        &lt;div class=&quot;mc-head&quot;&gt;

          &lt;b&gt;${esc(m.subject)}&lt;/b&gt;

          &lt;span class=&quot;mail-status-pill ${replies.length ? &#x27;st-4&#x27; : &#x27;st-1&#x27;}&quot;&gt;${replies.length ? &#x27;Replied&#x27; : &#x27;Awaiting reply&#x27;}&lt;/span&gt;

        &lt;/div&gt;

        &lt;div class=&quot;mail-bubble in&quot;&gt;&lt;small&gt;You · ${esc(m.date)} · ${esc(m.id)}&lt;/small&gt;${nl2br(m.body)}&lt;/div&gt;

        ${replies.map(r =&gt; `&lt;div class=&quot;mail-bubble out&quot;&gt;&lt;small&gt;PAG Moters Team · ${esc(r.date)}&lt;/small&gt;${nl2br(r.body)}&lt;/div&gt;`).join(&#x27;&#x27;)}

      &lt;/div&gt;`;

  }).join(&#x27;&#x27;);



  const directCards = standalone.map(o =&gt; `

    &lt;div class=&quot;mail-card&quot;&gt;

      &lt;div class=&quot;mc-head&quot;&gt;

        &lt;b&gt;${esc(o.subject)}&lt;/b&gt;

        &lt;span class=&quot;mail-status-pill st-3&quot;&gt;From PAG Moters&lt;/span&gt;

      &lt;/div&gt;

      &lt;div class=&quot;mail-bubble out&quot;&gt;&lt;small&gt;PAG Moters Team · ${esc(o.date)}&lt;/small&gt;${nl2br(o.body)}&lt;/div&gt;

    &lt;/div&gt;`).join(&#x27;&#x27;);



  box.innerHTML = directCards + sentCards;

}

// ==========================================
// 🚚 PINCODE &amp; DELIVERY TIME ESTIMATION
// ==========================================
function estimateDelivery(rawPin) {
  const pin = String(rawPin || &#x27;&#x27;).replace(/\D/g, &#x27;&#x27;).slice(0, 6);
  if (!/^[1-9][0-9]{5}$/.test(pin)) {
    return { ok: false, msg: &#x27;Kripya 6-digit ka sahi Indian pincode daalein (e.g. 273001 ya 400001).&#x27; };
  }
  const first = pin[0];
  let days = 2;
  let region = &#x27;Standard Delivery&#x27;;

  if ([&#x27;1&#x27;, &#x27;2&#x27;].includes(first)) {
    days = 1;
    region = &#x27;Local / North Hub Express (Same/Next Day)&#x27;;
  } else if ([&#x27;3&#x27;, &#x27;4&#x27;].includes(first)) {
    days = 2;
    region = &#x27;West / Central Express (2 Days)&#x27;;
  } else if ([&#x27;5&#x27;, &#x27;6&#x27;].includes(first)) {
    days = 3;
    region = &#x27;South Zone Fast Delivery (2-3 Days)&#x27;;
  } else {
    days = 4;
    region = &#x27;East / North-East Delivery (3-4 Days)&#x27;;
  }

  const d = new Date();
  d.setDate(d.getDate() + days);
  const dateStr = d.toLocaleDateString(&#x27;en-IN&#x27;, { weekday: &#x27;short&#x27;, day: &#x27;numeric&#x27;, month: &#x27;short&#x27; });

  return {
    ok: true,
    pin: pin,
    days: days,
    label: `${days === 1 ? &#x27;⚡ 24 Ghante me&#x27; : `${days} Dino me`} (${region})`,
    dateText: `Delivery by ${dateStr}`,
    km: Math.floor(15 + Math.random() * 50)
  };
}

function etaTextFor(pin) {
  const est = estimateDelivery(pin);
  return est.ok ? `${est.label} · ${est.dateText}` : &#x27;2-4 Business Days&#x27;;
}

function deliveryBoxHtml(pin) {
  if(!pin) return &#x27;&#x27;;
  const est = estimateDelivery(pin);
  if(est.ok) {
    return `&lt;div class=&quot;pin-eta ok&quot;&gt;⚡ &lt;b&gt;${est.pin}&lt;/b&gt;: ${est.label} · Expected: &lt;b&gt;${est.dateText}&lt;/b&gt; (FREE Delivery)&lt;/div&gt;`;
  } else {
    return `&lt;div class=&quot;pin-eta err&quot;&gt;${est.msg}&lt;/div&gt;`;
  }
}

// 📋 PRODUCT SPECIFICATIONS ENGINE
// ==========================================
function textToSpecs(raw) {
  if(!raw) return [];
  if(Array.isArray(raw)) return raw;
  if(typeof raw === &#x27;object&#x27;) {
    return Object.entries(raw).map(([k, v]) =&gt; ({ label: k, value: v }));
  }
  return String(raw).split(&#x27;\n&#x27;).map(line =&gt; {
    const idx = line.indexOf(&#x27;:&#x27;);
    if(idx &gt; 0) {
      return { label: line.slice(0, idx).trim(), value: line.slice(idx + 1).trim() };
    }
    return null;
  }).filter(Boolean);
}

function specsToText(specs) {
  if(!specs) return &#x27;&#x27;;
  if(typeof specs === &#x27;string&#x27;) return specs;
  if(Array.isArray(specs)) {
    return specs.map(s =&gt; `${s.label || s.key || &#x27;&#x27;}: ${s.value || &#x27;&#x27;}`).join(&#x27;\n&#x27;);
  }
  return Object.entries(specs).map(([k, v]) =&gt; `${k}: ${v}`).join(&#x27;\n&#x27;);
}

function persistReviews() {

  displayProducts(catalog);

function getProductReviews(prodId) {
  return productReviews.filter(r =&gt; Number(r.productId) === Number(prodId));
}

function effRating(p) {
  const revs = getProductReviews(p.id);
  if (!revs.length) return Number(p.rating || 4.5).toFixed(1);
  const sum = revs.reduce((acc, r) =&gt; acc + Number(r.rating || 5), 0);
  const baseRating = Number(p.rating || 4.5);
  const baseCount = Number(p.reviews || 10);
  const avg = ((baseRating * baseCount) + sum) / (baseCount + revs.length);
  return Math.min(5, Math.max(1, avg)).toFixed(1);
}

function effCount(p) {
  const revs = getProductReviews(p.id);
  return Number(p.reviews || 10) + revs.length;
}

function closeProductDetail() {
  document.getElementById(&#x27;productDetailOverlay&#x27;).classList.remove(&#x27;show&#x27;);
}

function checkPdPin() {
  const pin = (document.getElementById(&#x27;pdPinInput&#x27;).value || &#x27;&#x27;).trim();
  const res = document.getElementById(&#x27;pdPinResult&#x27;);
  if(!pin) {
    res.innerHTML = &#x27;&lt;span style=&quot;color:#b91c1c;font-size:11px;&quot;&gt;Pincode daalein.&lt;/span&gt;&#x27;;
    return;
  }
  const est = estimateDelivery(pin);
  if(est.ok) {
    localStorage.setItem(&#x27;pag_checked_pin&#x27;, est.pin);
    res.innerHTML = deliveryBoxHtml(est.pin);
  } else {
    res.innerHTML = `&lt;div class=&quot;pin-eta err&quot;&gt;${est.msg}&lt;/div&gt;`;
  }
}

function setRatingStars(val) {
  currentSelectedRating = val;
  const stars = document.querySelectorAll(&#x27;#starPickerContainer .pd-star&#x27;);
  stars.forEach((s, idx) =&gt; {
    s.classList.toggle(&#x27;on&#x27;, idx &lt; val);
  });
}

function submitProductReview(prodId) {
  if(!currentUser) {
    showToast(&#x27;Kripya pehle Login karein review post karne ke liye!&#x27;, &#x27;error&#x27;);
    openAuthModal(&#x27;login&#x27;);
    return;
  }
  const text = (document.getElementById(&#x27;pdReviewText&#x27;).value || &#x27;&#x27;).trim();
  if(!text) {
    showToast(&#x27;Kripya apna review comment likhein.&#x27;, &#x27;error&#x27;);
    return;
  }
  const newRev = {
    id: &#x27;REV-&#x27; + Date.now(),
    productId: prodId,
    customerName: currentUser.name,
    customerPhone: currentUser.phone || &#x27;&#x27;,
    rating: currentSelectedRating || 5,
    comment: text,
    date: new Date().toLocaleDateString(&#x27;en-IN&#x27;, {day:&#x27;numeric&#x27;, month:&#x27;short&#x27;, year:&#x27;numeric&#x27;})
  };
  productReviews.unshift(newRev);
  persistReviews();
  showToast(&#x27;Dhanyawad! Aapka review post ho gaya.&#x27;, &#x27;success&#x27;);
  openProductDetail(prodId);
}

function masterChangeOrderStatus(orderId, newStep) {
  const o = orders.find(x =&gt; x.id === orderId);
  if(!o) return;
  o.statusStep = Number(newStep);
  persistOrders();
  renderMasterPanel();
  showToast(`Order ${orderId} status updated to step ${newStep}!`, &#x27;success&#x27;);
}

function masterDeleteOrder(orderId) {
  if(!confirm(`Delete order &quot;${orderId}&quot; permanently?`)) return;
  orders = orders.filter(o =&gt; o.id !== orderId);
  persistOrders();
  renderMasterPanel();
  showToast(&#x27;Order deleted permanently.&#x27;, &#x27;info&#x27;);
}

function masterDeleteUser(phone) {
  if(!confirm(`Delete customer account with mobile ${phone}?`)) return;
  users = users.filter(u =&gt; cleanPhone(u.phone) !== cleanPhone(phone));
  persistUsers();
  renderMasterPanel();
  showToast(&#x27;Customer removed.&#x27;, &#x27;info&#x27;);
}

function masterDeleteReview(revId) {
  if(!confirm(&#x27;Delete this review?&#x27;)) return;
  productReviews = productReviews.filter((r, idx) =&gt; (r.id ? r.id !== revId : idx != revId));
  persistReviews();
  renderMasterPanel();
  showToast(&#x27;Review deleted.&#x27;, &#x27;info&#x27;);
}

function masterSaveCreds(e) {
  e.preventDefault();
  const phone = cleanPhone(document.getElementById(&#x27;mcSuperPhone&#x27;).value.trim());
  const pass = document.getElementById(&#x27;mcSuperPass&#x27;).value.trim();
  const mId = document.getElementById(&#x27;mcMasterId&#x27;).value.trim();
  const mPass = document.getElementById(&#x27;mcMasterPass&#x27;).value.trim();

  if(!phone || !pass || !mId || !mPass) {
    showToast(&#x27;Please fill all credential fields.&#x27;, &#x27;error&#x27;);
    return;
  }

  ADMIN_PHONE = phone;
  ADMIN_PASS = pass;
  MASTER_ID = mId;
  MASTER_PASS = mPass;

  localStorage.setItem(&#x27;pag_admin_creds&#x27;, JSON.stringify({ phone: ADMIN_PHONE, pass: ADMIN_PASS }));
  localStorage.setItem(&#x27;pag_master_creds&#x27;, JSON.stringify({ id: MASTER_ID, pass: MASTER_PASS }));

  showToast(&#x27;Login credentials updated successfully!&#x27;, &#x27;success&#x27;);
}

function masterDownloadBackup() {
  const backup = {
    version: &#x27;2.0&#x27;,
    date: new Date().toISOString(),
    catalog: catalog,
    orders: orders,
    users: users,
    teamMembers: teamMembers,
    staffChats: staffChats,
    companyNotice: companyNotice,
    mails: mails,
    reviews: productReviews,
    adminCreds: { phone: ADMIN_PHONE, pass: ADMIN_PASS },
    masterCreds: { id: MASTER_ID, pass: MASTER_PASS }
  };
  const str = &#x27;data:text/json;charset=utf-8,&#x27; + encodeURIComponent(JSON.stringify(backup, null, 2));
  const link = document.createElement(&#x27;a&#x27;);
  link.setAttribute(&#x27;href&#x27;, str);
  link.setAttribute(&#x27;download&#x27;, `PAG_Moters_Full_Backup_${new Date().toISOString().slice(0, 10)}.json`);
  document.body.appendChild(link);
  link.click();
  link.remove();
  showToast(&#x27;Full system backup JSON downloaded!&#x27;, &#x27;success&#x27;);
}

function masterRestoreBackup(e) {
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt) {
    try {
      const data = JSON.parse(evt.target.result);
      if(data.catalog) { catalog = data.catalog; persistCatalog(); }
      if(data.orders) { orders = data.orders; persistOrders(); }
      if(data.users) { users = data.users; persistUsers(); }
      if(data.teamMembers) { teamMembers = data.teamMembers; persistTeam(); }
      if(data.staffChats) { staffChats = data.staffChats; persistChats(); }
      if(data.companyNotice) { companyNotice = data.companyNotice; persistNotice(); }
      if(data.mails) { mails = data.mails; persistMails(); }
      if(data.reviews) { productReviews = data.reviews; persistReviews(); }
      if(data.adminCreds) {
        ADMIN_PHONE = data.adminCreds.phone;
        ADMIN_PASS = data.adminCreds.pass;
        localStorage.setItem(&#x27;pag_admin_creds&#x27;, JSON.stringify(data.adminCreds));
      }
      if(data.masterCreds) {
        MASTER_ID = data.masterCreds.id;
        MASTER_PASS = data.masterCreds.pass;
        localStorage.setItem(&#x27;pag_master_creds&#x27;, JSON.stringify(data.masterCreds));
      }
      renderMasterPanel();
      showToast(&#x27;Data restored successfully from backup!&#x27;, &#x27;success&#x27;);
    } catch(err) {
      showToast(&#x27;Restore failed: Invalid JSON file.&#x27;, &#x27;error&#x27;);
    }
  };
  reader.readAsText(file);
}

function masterRestartSale() {
  const newEnd = Date.now() + (12 * 60 * 60 * 1000);
  localStorage.setItem(&#x27;pag_sale_fixed_end_time&#x27;, newEnd.toString());
  const banner = document.querySelector(&#x27;.big-sale-banner&#x27;);
  if(banner) banner.classList.remove(&#x27;diwali-banner&#x27;);
  document.getElementById(&#x27;saleClockLabel&#x27;).innerText = &#x27;Offer Ends In&#x27;;
  showToast(&#x27;12-Hour Sale Timer restarted!&#x27;, &#x27;success&#x27;);
}

function masterClearData(type) {
  if(!confirm(`Are you absolutely sure you want to clear ${type.toUpperCase()}? This cannot be undone.`)) return;
  if(type === &#x27;orders&#x27;) { orders = []; persistOrders(); }
  else if(type === &#x27;users&#x27;) { users = []; persistUsers(); }
  else if(type === &#x27;chats&#x27;) { staffChats = []; persistChats(); }
  else if(type === &#x27;mails&#x27;) { mails = []; persistMails(); }
  else if(type === &#x27;catalog&#x27;) { catalog = JSON.parse(JSON.stringify(defaultCatalog)); persistCatalog(); }
  renderMasterPanel();
  showToast(`${type} cleared successfully.`, &#x27;info&#x27;);
}

function closeMasterForm() {
  document.getElementById(&#x27;masterEditOverlay&#x27;).style.display = &#x27;none&#x27;;
  masterEditContext = null;
}

function masterSubmitForm(e) {
  e.preventDefault();
  closeMasterForm();
}

initTheme();
applySiteConfig();
applySiteTexts();
startRealTimeClock();
startSaleTimer();
syncAuthUI();
syncCartUI();
displayProducts(catalog);
syncCategoryMenus();
renderNoticeDisplay();
checkMasterVisualBar();
&lt;/script&gt;

  <script>
    function copyEntireCode() {
      const area = document.getElementById('codeArea');
      area.select();
      area.setSelectionRange(0, 99999999);
      try {
        navigator.clipboard.writeText(area.value).then(() => {
          showDone();
        }).catch(() => {
          document.execCommand('copy');
          showDone();
        });
      } catch(e) {
        document.execCommand('copy');
        showDone();
      }
    }

    function showDone() {
      const st = document.getElementById('status');
      st.innerHTML = '✅ 100% POORA CODE COPY HO GAYA! Ab aap apne file me jaakar Paste (Ctrl + V) kar lijiye.';
      setTimeout(() => {
        st.innerHTML = '';
      }, 6000);
    }
  </script>
